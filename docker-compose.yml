services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assetuser}
      # The :? syntax causes docker compose to abort if the variable is unset/empty.
      # Never hard-code the password here; set it in a .env file (git-ignored).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-assetdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Expose locally for debugging only — remove in production.
      - "5433:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-assetuser} -d ${POSTGRES_DB:-assetdb}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - asm_net

  # ── FastAPI application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8083}:8083"
    environment:
      # Database — never embed credentials in the image; resolve from host env / .env
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-assetuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-assetdb}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}

      # OpenAI — injected at runtime from host environment or .env file
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-10}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-120}

      # API-key hashing pepper — required, never hard-code or commit this value.
      API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER must be set in .env}

      # Optional: restrict Host header to prevent Host-header injection
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:8083/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - asm_net

  # ── Streamlit customer portal (Phase 3) ──────────────────────────────────────
  # Pure API consumer — no database credentials, no OpenAI key, no admin
  # password. It only ever talks to the `app` service over HTTP using a
  # customer-supplied X-API-Key, exactly like any external integration would.
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    command:
      [
        "streamlit", "run", "customer_app.py",
        "--server.address", "0.0.0.0",
        "--server.port", "8503",
        "--server.headless", "true",
      ]
    ports:
      - "${PORTAL_PORT:-8503}:8503"
    environment:
      # Internal service DNS name — the browser talks to Streamlit directly,
      # but Streamlit's Python code calls the API server-side via this URL.
      CUSTOMER_API_BASE_URL: ${CUSTOMER_API_BASE_URL:-http://app:8083}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:8503/_stcore/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - asm_net

  # ── Streamlit admin console (Phase 2) ────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    command:
      [
        "streamlit", "run", "admin_app.py",
        "--server.address", "0.0.0.0",
        "--server.port", "8502",
        "--server.headless", "true",
      ]
    ports:
      - "${ADMIN_PORT:-8502}:8502"
    environment:
      # Database — same tenant DB as the API, read/written via SQLAlchemy directly.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-assetuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-assetdb}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}

      # API-key hashing pepper — reused so ApiKey.generate_api_key() is consistent.
      API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER must be set in .env}

      # Admin console password gate — required, never hard-code or commit this value.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:8502/_stcore/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - asm_net

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  asm_net:
    driver: bridge
